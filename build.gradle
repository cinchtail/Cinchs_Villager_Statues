plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id + "-[Forge-Fabric-1.21.x-26.2]"
}

def modName = (project.findProperty('mod_name') ?: project.name) as String
def modLicense = (project.findProperty('mod_license') ?: project.name) as String
def modId = project.findProperty('mod_id') as String
def modDescription = project.findProperty('mod_description') as String
def modAuthors = project.findProperty('mod_authors') as String
def modHomepage = project.findProperty('mod_homepage') as String
def modSources = project.findProperty('mod_sources') as String
def modDiscord = project.findProperty('mod_discord') as String
def modKofi = project.findProperty('mod_kofi') as String
def modCurseforge = project.findProperty('mod_curseforge') as String
def modModrinth = project.findProperty('mod_modrinth') as String
def modYouTube = project.findProperty('mod_youtube') as String

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"
minecraft {

    mappings channel: mapping_channel, version: mapping_version

    reobf = false

    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
        }

        client {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        server {
            property 'forge.enabledGameTestNamespaces', mod_id
            args '--nogui'
        }

        gameTestServer {
            property 'forge.enabledGameTestNamespaces', mod_id
        }

        data {
            workingDirectory project.file('run-data')
            args '--mod', mod_id, '--all', '--output', file('src/generated/resources/'), '--existing', file('src/main/resources/')
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
}

tasks.processResources {
    def meta = [
            'version': version,
            'minecraft_version': minecraft_version,
            'minecraft_version_range': minecraft_version_range,
            'forge_version': forge_version,
            'loader_version_range': loader_version_range,
            'mod_version': mod_version,
            'mod_name': modName,
            'mod_license': modLicense,
            'mod_id': modId,
            'mod_description': modDescription,
            'mod_authors': modAuthors,
            'mod_homepage': modHomepage,
            'mod_sources': modSources,
            'mod_discord': modDiscord,
            'mod_kofi': modKofi,
            'mod_curseforge': modCurseforge,
            'mod_modrinth': modModrinth,
            'mod_youtube': modYouTube,
    ]
    filesMatching('fabric.mod.json') { expand(meta) }
    filesMatching('quilt.mod.json') { expand(meta) }
    filesMatching('META-INF/*.toml') { expand(meta) }
    filesMatching('pack.mcmeta') { expand(meta) }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifact jar
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/mcmodsrepo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea.module { downloadJavadoc = downloadSources = true }

eclipse {
    synchronizationTasks 'genEclipseRuns'
}

sourceSets.each {
    def dir = layout.buildDirectory.dir("sourcesSets/$it.name")
    it.output.resourcesDir = dir
    it.java.destinationDirectory = dir
}